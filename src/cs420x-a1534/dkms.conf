PACKAGE_NAME="macbook91-cs4208"
PACKAGE_VERSION="@PKGVER@"

# Built module keeps the in-tree name so that, installed under
# /lib/modules/<kver>/updates/, depmod prefers it over the stock
# kernel/sound/hda/codecs/cirrus/ module. Removing this DKMS module and
# running depmod restores the stock codec; nothing else is touched.
BUILT_MODULE_NAME[0]="snd-hda-codec-cs420x"
DEST_MODULE_LOCATION[0]="/updates"

# PKGVER is baked into MODULE_VERSION together with a hash of the sources, so
# the verifier can prove which source produced the loaded module.
MAKE[0]="make KDIR=/lib/modules/${kernelver}/build PKGVER=${PACKAGE_VERSION}"
CLEAN="make KDIR=/lib/modules/${kernelver}/build clean"

# Only the kernel series this tree ships sources for. Any other kernel is
# skipped by DKMS and keeps its in-tree codec, instead of a build being
# attempted and failing at the Makefile's `check` target, and the package's
# pacman hook prints a warning for it after the transaction. The root
# Makefile's install target writes the value from kheaders/KERNEL-SERIES,
# through contrib/pacman/kernel-series --dkms-regex, the script the hook and
# macbook91-audio-verify ask too; it is never edited here. Adding a series
# means adding a tag (packaging/fetch-upstream.sh --tag vX.Y.Z --accept-new)
# and committing packaging/upstream.lock.
# The dot after the series is required: a release candidate named X.Y-rcN (no
# patch level) is skipped, which is the safe direction.
BUILD_EXCLUSIVE_KERNEL="@KERNEL_SERIES_RE@"

AUTOINSTALL="yes"

# Do not let a kernel update silently leave the machine with a module built
# against the wrong tree: the Makefile's `check` target already refuses to
# build without a matching .config, Module.symvers and utsrelease.h, and
# selects the compiler family from the target kernel's own .config (the
# CachyOS LTS kernel is built with GCC, the current CachyOS kernel with
# clang).
#
# Nothing here names a kernel version - ${kernelver} is DKMS's. The Makefile reads the series from the target
# kernel's utsrelease.h and builds that series' own cs420x.c against that
# series' own private HDA headers. The source tree it builds is assembled
# rather than carried in the project's repository, but that happens once, at
# package build time. What DKMS gets is a complete tree, and a rebuild during
# a kernel upgrade still reaches no network at all.
#
# One consequence is worth knowing: a series this tree does not ship needs a
# package built for it, not an override of the check. See UPSTREAM.lock for
# the tags this tree came from.
