# MacBook9,1 (A1534) CS4208 — card policy: profile set, software volume.
#
# Two separate things live here. Both are required; neither is a preference.
#
#   1. device.profile-set — which profiles and ports this card may have at all.
#   2. api.alsa.soft-mixer — where the volume slider acts.
#
# WHY THE PROFILE SET IS NOT OPTIONAL
#
# The stock ACP profile set gives this card twenty-odd analog profiles it
# cannot open (the internal PCM accepts exactly S16_LE / 44100 / 4 channels)
# and exactly one analog output port, `analog-output-speaker`, whose stock path
# declares itself unavailable while the headphone jack reports present.
#
# Here that is wrong twice over. The driver moves the stream to the headphone
# converter itself, so the port serves headphones too; and since it is the only
# analog output port, its going unavailable takes the whole profile with it.
# WirePlumber then falls back to `input:analog-stereo` — a card with no sink —
# and the desktop shows "Dummy Output" with no sound. It bites on resume and on
# any other moment profile selection reruns with the plug already in.
#
# macbook91-cs4208.conf fixes both: one analog output mapping that matches the
# hardware, on a path whose availability does not depend on the jack. Its
# stereo mapping is an output too, for the stock codec driver on a kernel the
# package does not support; with this driver loaded it cannot open.
#
# WHY THE SOFTWARE MIXER IS NOT OPTIONAL
#
# The internal speaker path has NO hardware volume control. Verified on the
# codec: converter 0x0a (wcaps 0x46631) and speaker pin 0x1d (wcaps 0x406301)
# both lack an output amplifier. Every ALSA volume the card exposes — Master,
# PCM, Line Out — belongs to the analog DACs 0x02-0x05 and headphone pin 0x10,
# i.e. the headphone path only.
#
# Without api.alsa.soft-mixer the desktop slider drives those hardware controls
# instead, which do nothing useful for the speakers: on the test machine the level barely
# changed between 10% and 100% and the output clipped badly, while a 12% tone
# written straight to the PCM was clean. With soft-mixer, PipeWire attenuates
# digitally before the codec and the slider behaves normally.
#
# NOTE ON SYNTAX: everything must live in ONE `monitor.alsa.rules = [ ... ]`
# array with comma-separated objects. Defining the key twice (or using `+=`)
# makes the later definition replace the earlier one, silently losing the
# soft-mixer rule — which is exactly what happened in an early build.
#
# If the audio controller is not at PCI 00:1f.3, adjust device.name
# (find it with `wpctl status` or `pactl list cards short`).

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        # See the header. Absolute path: ACP takes an absolute
        # profile-set as-is instead of resolving it under the stock
        # profile-sets directory, so nothing is written into another
        # package's data directory.
        device.profile-set = "/usr/share/macbook91-cs4208/acp/macbook91-cs4208.conf"

        api.alsa.soft-mixer = true

        # Do NOT let the session manager switch profile or port on a jack
        # event. This driver moves the stream between converters in hardware
        # when the headphone jack changes (converter 0x0a -> 0x02, with a
        # 2-channel format), so the card must stay on one 4-channel profile
        # and let the codec do the routing.
        #
        # Leaving these on breaks headphones outright. The speaker PCM offers
        # exactly one configuration - S16_LE, 44100 Hz, 4 channels - because
        # the amplifiers sit on a 64-bit-clock TDM frame. The only profile
        # that can satisfy it is analog-surround-40. Plugging the jack made
        # WirePlumber try to switch to a stereo profile the PCM cannot
        # provide, the sink failed to open, and PipeWire fell back to Dummy
        # Output ("Schein-Ausgabe") with no sound at all.
        #
        # These two are necessary but were never sufficient: they stop a
        # switch, they do not stop the profile becoming unavailable in the
        # first place. That needs the profile set above.
        api.acp.auto-profile = false
        api.acp.auto-port = false
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_00_1f.3.analog-surround-40.*" }
    ]
    actions = {
      update-props = {
        node.description = "Internal Speakers (MacBook9,1)"

        # The four TDM slots are two stereo PAIRS, not a surround layout.
        # Measured on the test machine by playing one slot at a time: slot 0 left,
        # slot 1 right, slot 3 right, slot 2 heard centrally (the listener
        # was not certain for slots 2 and 3). Two drivers per side is the
        # consistent reading, and it matches AppleHDA's two TDM buses of two
        # slots each.
        #
        # PipeWire necessarily presents the device as FL/FR/RL/RR, so stereo
        # content would otherwise reach only slots 0 and 1 - half the
        # speakers. "simple" upmix copies front to rear verbatim, which puts
        # the left signal on both left-side amplifiers and the right signal
        # on both right-side ones. Explicitly NOT the default "psd" method,
        # which synthesises a pseudo-surround rear channel and would be
        # wrong for what are really duplicate stereo pairs.
        channelmix.upmix = true
        channelmix.upmix-method = simple
      }
    }
  }
]
