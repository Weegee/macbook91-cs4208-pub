; MacBook9,1 (A1534) CS4208 - the one analog output port of this card.
;
; WHY THIS FILE EXISTS
;
; On this machine the codec, not the session manager, decides whether audio
; leaves through the internal speakers (converter 0x0a -> pin 0x1d, four TDM
; slots) or through the headphone jack (converter 0x02 -> pin 0x10, stereo).
; The driver switches on the jack's unsolicited event. Userspace therefore has
; exactly one output port and must keep it selected in both states.
;
; The stock PulseAudio/ACP path `analog-output-speaker` cannot express that.
; It carries
;
;     [Jack Headphone]
;     state.plugged = no
;
; which marks the speaker port UNAVAILABLE whenever the headphone jack reports
; present. That is correct for an ordinary laptop, where a separate
; `analog-output-headphones` port takes over. Here there is no second port: the
; only analog output mapping this card can satisfy is analog-surround-40 (the
; PCM offers exactly S16_LE / 44100 / 4ch), and that mapping has no headphone
; port. So with headphones plugged the port went unavailable, the profile with
; it, and WirePlumber fell back to `input:analog-stereo` - a card with no sink
; at all, i.e. "Dummy Output" and silence.
;
; It bit hardest after a resume, because that is when profile selection runs
; again: sound worked before the suspend and was gone after it, with the
; headphones never leaving the socket.
;
; This path is the stock analog-output-speaker with every headphone/line-out
; jack stanza removed, so port availability no longer depends on the jack, plus
; an explicit `Line Out` element - that control is pin 0x10's amplifier, i.e.
; the headphone volume, and the port now owns both outputs.
;
; PROVENANCE
;   derived from /usr/share/alsa-card-profile/mixer/paths/analog-output-speaker.conf
;   alsa-card-profiles 1:1.6.8-1
;   sha256 be156d5186887f28dcd2f129d1d9efd91643f74c6859f3c305d773aadd04be7e
;   Removed stanzas: [Jack Headphone] [Jack Dock Headphone] [Jack Front Headphone]
;                    [Jack Line Out] [Jack Line Out Front] [Jack Front Line Out]
;                    [Jack Rear Line Out] [Jack Dock Line Out]
;   Added stanza:    [Element Line Out]
;   The trailing include is absolute because this file does not live in the
;   stock paths directory.
;
; Licensed LGPL-2.1-or-later, as the file it derives from.

[General]
priority = 100
description-key = analog-output-speaker

[Properties]
device.icon_name = audio-speakers

[Jack Speaker]
required-any = any

[Jack Speaker Phantom]
required-any = any
state.plugged = unknown
state.unplugged = unknown

[Jack Speaker Front Phantom]
required-any = any
state.plugged = unknown
state.unplugged = unknown

[Jack Speaker - Output]
required-any = any

[Element Hardware Master]
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element Master]
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element Master Mono]
switch = off
volume = off

; Make sure the internal speakers are not auto-muted once the system has speakers
[Element Auto-Mute Mode]
enumeration = select

[Option Auto-Mute Mode:Disabled]
name = analog-output-speaker

; Pin 0x10's output amplifier is exposed under this name because the generic
; parser sees it as this card's only conventional output - the speaker pin
; belongs to the A1534 four-channel path and never reaches the parser. It is
; the headphone volume, and headphones are served by this same port, so it is
; held unmuted and merged into the port volume rather than switched off the way
; the stock speaker path switches off a `Headphone` element.
[Element Line Out]
switch = on
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element Headphone]
switch = off
volume = off

[Element Headphone,1]
switch = off
volume = off

[Element Headphone2]
switch = off
volume = off

[Element Headphone+LO]
switch = off
volume = off

[Element Speaker+LO]
required-any = any
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element Speaker]
required-any = any
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element Desktop Speaker]
required-any = any
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element Front]
switch = mute
volume = merge
override-map.1 = all-front
override-map.2 = front-left,front-right

[Element Front Speaker]
switch = mute
volume = merge
override-map.1 = all-front
override-map.2 = front-left,front-right
required-any = any

[Element Speaker Front]
switch = mute
volume = merge
override-map.1 = all-front
override-map.2 = front-left,front-right
required-any = any

[Element Rear]
switch = mute
volume = merge
override-map.1 = all-rear
override-map.2 = rear-left,rear-right

[Element Surround]
switch = mute
volume = merge
override-map.1 = all-rear
override-map.2 = rear-left,rear-right

[Element Surround Speaker]
switch = mute
volume = merge
override-map.1 = all-rear
override-map.2 = rear-left,rear-right
required-any = any

[Element Speaker Surround]
switch = mute
volume = merge
override-map.1 = all-rear
override-map.2 = rear-left,rear-right
required-any = any

.include /usr/share/alsa-card-profile/mixer/paths/analog-output.conf.common
