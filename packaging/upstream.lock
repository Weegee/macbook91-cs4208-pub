# Hashes of every file the build is allowed to take from outside this
# repository, and of the two files that are derived from them by patch.
#
#   <tag>  <sha256>  <path inside src/cs420x-a1534>
#
# "derived" is not a kernel tag. It marks a file that has no kernel version
# because it is produced offline from something tracked here: the A1534
# bring-up sequence, which is never downloaded.
#
# packaging/fetch-upstream.sh refuses to build against a (tag, path) pair it
# does not find here, and fails hard - with no override - if a pair it does
# find has different bytes. A new kernel series is added by running the
# fetcher with --accept-new and committing the result, so that new hashes are
# reviewed like any other change.
#
# vendored/ORIGINAL-a1534_sequence.h is deliberately absent: it is tracked in
# Git, so Git is its integrity record. Its hash is still stated for the
# packaged copy, in vendored/PROVENANCE.sha256.
#
# v7.2.6 seeded 2026-09-21. The six fetched files are byte-identical to what
# an earlier release carried in the repository as "v7.2.4"; the two derived
# files were byte-identical to what that release shipped and what was tested
# on hardware.
#
# v6.18.55 seeded 2026-10-20 for the CachyOS LTS kernel (6.18.55-2-cachyos-lts).
# One tag per kernel series; the series are independent. local-changes.patch
# applies to the v6.18.55 cs420x.c at fuzz 0. It was built, but not yet run on
# hardware, when seeded; it ran on hardware later on 2026-10-20 (20261020.03).
#
# 2026-10-20: the pins of both derived cs420x.c rows changed because one comment in
# local-changes.patch was reworded (same line count, no code change: the files
# are identical once comments are stripped). 2026-10-21: changed again, for the
# same reason, by two comments of local-changes.patch.

